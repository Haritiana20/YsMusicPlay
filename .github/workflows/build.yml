name: Build Ys Music Play V6.0.1

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Android APK (ARM64, Android 10+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch Demucs Android engine and submodules
        run: |
          mkdir -p third_party
          git clone --depth 1 --recurse-submodules \
            https://github.com/jPaauwe/demucs-android \
            third_party/demucs-android
          test -f third_party/demucs-android/CMakeLists.txt
          test -f third_party/demucs-android/third_party/eigen/Eigen/Dense

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK and native ABI
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libsdengine_jni.so"
          if unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then
            echo "Unexpected ARM32 library in ARM64-only build"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V6.0.1-Android10-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
